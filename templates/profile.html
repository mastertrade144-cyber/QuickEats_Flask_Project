{% extends "base.html" %}
{% block title %}Profile — QuickEats{% endblock %}
{% block content %}
<div class="page-heading"><p class="eyebrow">Account</p><h1>Profile</h1></div>
<div class="profile-layout">
<div class="profile-card"><div class="profile-avatar">{{ user['name'][0]|upper }}</div><h2>{{ user['name'] }}</h2><p>{{ user['email'] }}</p><a href="{{ url_for('logout') }}" class="text-danger">Logout</a></div>
<div class="form-card"><h2>Personal Information</h2><form method="post">
<label>Name<input name="name" value="{{ user['name'] }}" required></label>
<label>Email<input value="{{ user['email'] }}" disabled></label>
<label>Phone<input name="phone" value="{{ user['phone'] }}" placeholder="+91..."></label>
<label>Default Address<textarea name="address">{{ user['address'] }}</textarea></label>
<button class="btn primary">Save Changes</button>
</form></div>
</div>
{% endblock %}
